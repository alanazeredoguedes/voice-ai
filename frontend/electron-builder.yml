appId: com.voiceai.app
productName: Voice AI
directories:
  buildResources: build
  output: dist
# compressão máxima do instalador (build mais lento, arquivo menor)
compression: maximum
# idiomas do Chromium: só os do app (os outros ~50 não são usados)
electronLanguages:
  - pt-BR
  - en-US
files:
  - out/**/*
  # ícone do app (janela e bandeja); o ícone do instalador vem de build/icon.png e build/icon.ico
  - resources/**/*
  - "!**/*.{ts,map}"
win:
  target:
    - nsis
# atualização automática (electron-updater): o app consulta a última release deste repositório no GitHub
publish:
  provider: github
  owner: alanazeredoguedes
  repo: voice-ai
nsis:
  # sem espaços: o GitHub troca espaço por ponto no nome do arquivo, e o latest.yml apontaria para um nome que não existe
  artifactName: Voice-AI-Setup-${version}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  target:
    - AppImage
  category: Utility
appImage:
  artifactName: Voice-AI-${version}.${ext}
  # gzip, e não o xz do "compression: maximum": o AppImage descomprime o app a cada abertura, e com xz só ler
  # o Electron levava ~7 s (o arquivo fica um pouco maior, mas abre bem mais rápido)
  compression: gzip
afterPack: after-pack.js
extraResources:
  - from: ../backend
    to: backend
    filter:
      - "**/*"
      - "!venv/**"
      - "!venv-dist/**"
      - "!python-dist/**"
      - "!python-packages/**"
      - "!hf-cache/**"
      - "!__pycache__/**"
      - "!**/*.pyc"
  # bibliotecas Python instaladas no build (build.ps1): o app instalado abre sem baixar nada
  - from: ../backend/python-packages
    to: python-packages
    filter:
      - "**/*"
      - "!**/*.pdb"
  - from: ../backend/python-dist
    to: python-dist
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!share/doc/**"
      - "!share/man/**"
      # partes do Python que o app não usa (testes da biblioteca padrão, IDLE, demos)
      - "!Lib/test/**"
      - "!Lib/idlelib/**"
      - "!Lib/turtledemo/**"
      - "!**/*.pdb"
