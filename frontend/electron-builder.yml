appId: com.voiceai.app
productName: Voice AI
directories:
  buildResources: build
  output: dist
files:
  - out/**/*
  - "!**/*.{ts,map}"
win:
  target:
    - nsis
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
linux:
  target:
    - AppImage
  category: Utility
afterPack: after-pack.js
extraResources:
  - from: ../backend
    to: backend
    filter:
      - "**/*"
      - "!venv/**"
      - "!venv-dist/**"
      - "!python-dist/**"
      - "!__pycache__/**"
      - "!**/*.pyc"
  - from: ../backend/python-dist
    to: python-dist
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!share/doc/**"
      - "!share/man/**"
      - "!**/*.pdb"
