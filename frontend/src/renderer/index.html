<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Voice AI</title>
  </head>
  <body style="margin: 0; background: #020617">
    <!-- tela de abertura: aparece na hora e some quando o app monta (enquanto o backend inicia) -->
    <div id="app">
      <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; font-family: system-ui, sans-serif">
        <div style="width: 34px; height: 34px; border-radius: 50%; border: 3px solid #1e293b; border-top-color: #818cf8; animation: boot-spin 0.9s linear infinite"></div>
        <p id="boot-status" style="margin: 0; color: #94a3b8; font-size: 14px; max-width: 420px; text-align: center">Iniciando o Voice AI…</p>
      </div>
      <style>@keyframes boot-spin { to { transform: rotate(360deg) } }</style>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
