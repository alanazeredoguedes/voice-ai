# Gera os instaladores e publica a release quando uma tag vX.Y.Z é enviada (npm run release).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: AppImage (Linux)
    # Ubuntu mais antigo disponível: o AppImage roda em distros com glibc igual ou mais nova
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências
        working-directory: frontend
        run: npm ci
      - name: Build
        run: bash ./build.sh 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Mostrar o erro
        if: failure()
        shell: bash
        run: |
          # o final do log vira uma anotação de erro, visível no resumo da execução
          msg=$(tail -n 60 build.log | sed 's/\x1b\[[0-9;]*m//g; s/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build falhou::$msg"
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          # latest-linux.yml é o que o app lê para saber que há versão nova
          path: |
            frontend/dist/*.AppImage
            frontend/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Instalador (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências
        working-directory: frontend
        run: npm ci
      - name: Build
        shell: pwsh
        run: |
          & ./build.ps1 *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Mostrar o erro
        if: failure()
        shell: bash
        run: |
          # o final do log vira uma anotação de erro, visível no resumo da execução
          msg=$(tail -n 60 build.log | sed 's/\x1b\[[0-9;]*m//g; s/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build falhou::$msg"
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          # latest.yml e .blockmap: o app os usa para detectar e baixar a atualização
          path: |
            frontend/dist/*.exe
            frontend/dist/*.exe.blockmap
            frontend/dist/latest.yml
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publicar release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: files
          merge-multiple: true
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh files
          gh release create "$TAG" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Voice AI ${TAG#v}" \
            --generate-notes
