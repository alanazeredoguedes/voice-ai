# Gera os instaladores e publica a release quando uma tag vX.Y.Z é enviada (npm run release).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux:
    name: AppImage (Linux)
    # Ubuntu mais antigo disponível: o AppImage roda em distros com glibc igual ou mais nova
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Dependências
        working-directory: frontend
        run: npm ci
      - name: Build
        run: bash ./build.sh 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
      - name: Mostrar o erro
        if: failure()
        shell: bash
        run: |
          # o final do log vira uma anotação de erro, visível no resumo da execução
          msg=$(tail -n 60 build.log | sed 's/\x1b\[[0-9;]*m//g; s/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build falhou::$msg"
      - uses: actions/upload-artifact@v5
        with:
          name: linux
          # latest-linux.yml é o que o app lê para saber que há versão nova
          path: |
            frontend/dist/*.AppImage
            frontend/dist/latest-linux.yml
          if-no-files-found: error
          retention-days: 3

  windows:
    name: Instalador (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # chave do cache do node_modules: hash do lockfile sem a versão do app (ver .github/scripts/lock-hash.mjs)
      - name: Chave do cache do node_modules
        id: lock
        shell: bash
        run: echo "hash=$(node .github/scripts/lock-hash.mjs)" >> "$GITHUB_OUTPUT"
      # node_modules pronto (inclui o binário do Electron): o npm ci levava ~50 s. Também só restaura; o cache é criado
      # pelo cache-python.yml na main (ver o comentário abaixo). Sem cache, instala do zero como antes.
      - name: Restaurar o cache do node_modules
        id: node-cache
        uses: actions/cache/restore@v4
        with:
          path: frontend/node_modules
          key: win-node-${{ steps.lock.outputs.hash }}
      - name: Dependências
        if: steps.node-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci
      # Python embutido, bibliotecas do núcleo e lista da tradução: só mudam quando os requirements (ou o build.ps1) mudam.
      # Só RESTAURA: o cache é criado pelo workflow "Cache do Python" (cache-python.yml), que roda na main. Uma execução
      # disparada por tag só enxerga caches da própria tag e da branch padrão, então um cache salvo aqui nunca seria
      # reaproveitado pela release seguinte. Sem cache (miss), o build.ps1 instala tudo do zero, como antes.
      - name: Restaurar o cache do Python e das bibliotecas
        uses: actions/cache/restore@v4
        with:
          path: |
            backend/python-dist
            backend/python-packages
            backend/translate-lock.txt
          key: win-python-${{ hashFiles('backend/requirements.txt', 'backend/requirements-core.txt', 'build.ps1', 'tools/make_translate_lock.py') }}
      - name: Build
        shell: pwsh
        run: |
          & ./build.ps1 *>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Mostrar o erro
        if: failure()
        shell: bash
        run: |
          # o final do log vira uma anotação de erro, visível no resumo da execução
          msg=$(tail -n 60 build.log | sed 's/\x1b\[[0-9;]*m//g; s/%/%25/g; s/\r//g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build falhou::$msg"
      - uses: actions/upload-artifact@v5
        with:
          name: windows
          # latest.yml e .blockmap: o app os usa para detectar e baixar a atualização
          path: |
            frontend/dist/*.exe
            frontend/dist/*.exe.blockmap
            frontend/dist/latest.yml
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publicar release
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: files
          merge-multiple: true
      - name: Criar release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -lh files
          gh release create "$TAG" files/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Voice AI ${TAG#v}" \
            --generate-notes
